<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articol · Darurile filosofiei</title><style>body{margin:0;background:#fffefa;color:#27332e;font:19px/1.8 Georgia,serif}main{max-width:740px;margin:65px auto;padding:0 24px}a{color:#52624e}h1{line-height:1.2;font-size:clamp(32px,6vw,52px)}img{max-width:100%}blockquote{border-left:3px solid #8b6b42;padding-left:20px;color:#555}</style></head><body><main><a href="/">← Înapoi la prima pagină</a><h1 id="title">Articol</h1><div id="body">Se încarcă…</div></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script>const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[\p{L}\p{N}-]+$/.test(slug)){document.getElementById('body').textContent='Articol invalid.'}else fetch('/content/posts/'+slug+'.md').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{const m=t.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);let body=m?t.slice(m[0].length):t;let title=m?.[1].match(/^title:\s*["']?(.*?)["']?\s*$/m)?.[1]||'Articol';document.getElementById('title').textContent=title;document.title=title+' · Darurile filosofiei';document.getElementById('body').innerHTML=DOMPurify.sanitize(marked.parse(body))}).catch(()=>document.getElementById('body').textContent='Articolul nu a putut fi încărcat.');</script></body></html>
